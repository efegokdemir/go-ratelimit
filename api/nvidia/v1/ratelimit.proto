syntax = "proto3";

option go_package = "gitlab-master.nvidia.com/kratos-dataverse-observability/go-ratelimit/api/nvidia/v1/;kdo_pb";
import "google/api/annotations.proto";
//import "google/protobuf/empty.proto";
//import "google/protobuf/struct.proto";
//import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

/*
GOOGLEAPIS=~/googleapis
GW_DIR=$(go list -m -f '{{.Dir}}' github.com/grpc-ecosystem/grpc-gateway/v2)
protoc -I . -I ~/googleapis -I $GW_DIR --go_out=. --go-grpc_out=. --grpc-gateway_out=. api/kratos/v1/kdo.proto
protoc -I . -I ~/googleapis -I $GW_DIR --openapiv2_out=./docs/swagger --openapiv2_opt=logtostderr=true --openapiv2_opt=json_names_for_fields=true api/nvidia/v1/ratelimit.proto

rm -rf gitlab-master.nvidia.com/
*/

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Rate limiting Admin API";
    version: "1.0";
    description: "Rate limiting Admin API";
    contact: {
      name: "Nvidia Inc";
      email: "nvidia@nvidia.com";
    };
  };
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
};


// Message definitions for the admin API endpoints
message ClientConfig {
  int32 request_limit = 1;
  int64 byte_limit = 2;
  int32 window_secs = 3;
}

message GetClientConfigRequest {
  string client_id = 1;
}

message ClientConfigResponse {
  ClientConfig config = 1;
}

message UpdateClientConfigRequest {
  string client_id = 1;
  ClientConfig config = 2;
}

message ResetClientConfigRequest {
  string client_id = 1;
}

message StatusResponse {
  string status = 1;
}

service AdminService {

 
  rpc GetClientConfig (GetClientConfigRequest) returns (ClientConfigResponse) {
    option (google.api.http) = {
      get: "/admin/config/{client_id}"
    };
  }
  
  rpc UpdateClientConfig (UpdateClientConfigRequest) returns (StatusResponse) {
    option (google.api.http) = {
      put: "/admin/config/{client_id}"
      body: "config"
    };
  }
  
  rpc ResetClientConfig (ResetClientConfigRequest) returns (StatusResponse) {
    option (google.api.http) = {
      delete: "/admin/config/{client_id}"
    };
  }
}
