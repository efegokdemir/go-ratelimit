# go-ratelimit server configuration
server:
  grpc:
    port: ":8080"
    max_recv_msg_size: 4194304  # 4MB
    max_send_msg_size: 4194304  # 4MB
  
  http:
    port: ":8081"
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 120s
  
  admin:
    port: ":8082"
    enable_auth: true
    # admin_key set via environment variable for security

# Rate limiting configuration
ratelimit:
  # Redis configuration
  redis:
    addr: "${RATELIMIT_REDIS_ADDR:localhost:6379}"
    db: ${RATELIMIT_REDIS_DB:0}
    password: "${RATELIMIT_REDIS_PASSWORD:}"
    max_retries: 3
    dial_timeout: 5s
    read_timeout: 3s
    write_timeout: 3s
    pool_size: 10
    min_idle_conns: 5
  
  # Default limits (can be overridden per client)
  defaults:
    request_limit: ${RATELIMIT_DEFAULT_REQUEST_LIMIT:100}
    byte_limit: ${RATELIMIT_DEFAULT_BYTE_LIMIT:1048576}
    window_seconds: ${RATELIMIT_WINDOW_SECONDS:60}
  
  # Key generation
  key_func: "header"  # Options: header, ip, path, custom
  key_config:
    header_name: "X-Client-ID"
    fallback_to_ip: true
    prefix: "client"
    sanitizer: "alphanumeric"  # Options: alphanumeric, none, custom

# Logging configuration
logging:
  level: "${RATELIMIT_LOG_LEVEL:info}"
  format: "json"  # Options: json, console
  output_paths:
    - stdout
  error_output_paths:
    - stderr

# Metrics configuration
metrics:
  enabled: true
  namespace: "ratelimit"
  subsystem: "server"
  
# Health check configuration
health:
  enabled: true
  check_redis: true
  
# Authentication configuration (optional)
auth:
  jwt:
    enabled: false
    jwks_url: ""
    audience: ""
    issuer: ""
  
  # API key authentication
  api_key:
    enabled: true
    header_name: "X-API-Key"
    # Keys managed via environment or secrets

# Client-specific configurations (optional)
clients:
  # Example client with custom limits
  example-service:
    request_limit: 1000
    byte_limit: 10485760  # 10MB
    window_seconds: 60
  
  # High-priority client
  premium-service:
    request_limit: -1  # Unlimited requests
    byte_limit: 104857600  # 100MB
    window_seconds: 60
