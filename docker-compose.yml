version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ratelimit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ratelimit-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ratelimit-server
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"  # gRPC port
      - "8081:8081"  # HTTP/REST gateway port
      - "8082:8082"  # Admin/metrics port
    environment:
      # Redis configuration
      RATELIMIT_REDIS_ADDR: "redis:6379"
      RATELIMIT_REDIS_DB: "0"
      
      # Default rate limits
      RATELIMIT_DEFAULT_REQUEST_LIMIT: "100"
      RATELIMIT_DEFAULT_BYTE_LIMIT: "1048576"  # 1MB
      RATELIMIT_WINDOW_SECONDS: "60"
      
      # Admin API configuration
      RATELIMIT_ADMIN_ENABLED: "true"
      RATELIMIT_ADMIN_AUTH_ENABLED: "true"
      RATELIMIT_ADMIN_KEY: "change-me-in-production"
      
      # Logging
      RATELIMIT_LOG_LEVEL: "info"
      
      # Service configuration
      GRPC_PORT: ":8080"
      HTTP_PORT: ":8081"
      ADMIN_PORT: ":8082"
    volumes:
      - ./configs:/configs:ro
    command: ["server", "--config", "/configs/server.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: ratelimit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - ratelimit-server

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: ratelimit-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
